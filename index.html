<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>周报记录</title>
<link rel="icon" type="image/jpeg" href="./lALPACOG837VrlbNAgDNAgA_512_512.png_620x10000q90g.jpg">
<style>
:root {
  --orange: #FF6B35;
  --orange-bg: #FFF0EA;
  --green: #07C160;
  --green-bg: #E8F9EE;
  --blue: #1967d2;
  --blue-bg: #E8F0FE;
  --bg: #F2F4F7;
  --card: #FFFFFF;
  --border: #E4E8EF;
  --text: #1A1A2E;
  --text-sub: #6B7280;
  --text-light: #9CA3AF;
  --radius: 12px;
  --shadow: 0 2px 8px rgba(0,0,0,0.08);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; overflow: hidden; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif;
  background: var(--bg);
  color: var(--text);
  font-size: 14px;
  display: flex; flex-direction: column;
}

/* ── TOPBAR ── */
.topbar {
  background: #fff;
  border-bottom: 1px solid var(--border);
  padding: 0 24px;
  height: 56px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-shrink: 0;
}
.topbar-title { font-size: 17px; font-weight: 700; letter-spacing: -.3px; }
.topbar-week {
  font-size: 13px; color: var(--blue);
  background: var(--blue-bg); padding: 4px 12px;
  border-radius: 20px; font-weight: 600;
}

/* ── LAYOUT ── */
.layout {
  display: grid;
  grid-template-columns: 380px minmax(0, 1fr);
  gap: 20px;
  width: 100%;
  max-width: 1200px;
  margin: 0 auto;
  padding: 20px 20px;
  align-items: stretch;
  flex: 1;
  min-height: 0;
  box-sizing: border-box;
  overflow: hidden;
}

/* ── CARD ── */
.card {
  background: var(--card);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  display: flex;
  flex-direction: column;
  overflow: hidden;
  height: 100%;
  min-width: 0;
}
.card-head {
  padding: 18px 20px 14px;
  font-size: 16px;       /* 加大 */
  font-weight: 800;      /* 加粗 */
  color: var(--text);
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}

/* ── FORM ── */
.form-body { padding: 20px; flex: 1; min-height: 0; display: flex; flex-direction: column; overflow-y: auto; }
.form-group { margin-bottom: 16px; }
.form-label {
  font-size: 12px; font-weight: 600;
  color: var(--text-sub); margin-bottom: 8px; display: block;
}
.type-tabs { display: flex; flex-wrap: wrap; gap: 8px; }
.type-tab {
  padding: 6px 14px; border-radius: 20px;
  border: 1.5px solid var(--border);
  background: #fff; color: var(--text-sub);
  font-size: 13px; font-weight: 500;
  cursor: pointer; transition: all .15s; user-select: none;
}
.type-tab:hover { border-color: var(--orange); color: var(--orange); }
.type-tab.active { background: var(--orange); border-color: var(--orange); color: #fff; font-weight: 600; }

input[type="text"], textarea {
  width: 100%; padding: 10px 12px;
  border: 1.5px solid var(--border); border-radius: 8px;
  font-size: 14px; font-family: inherit; color: var(--text);
  background: #FAFBFD; outline: none; transition: border-color .15s;
}
input[type="text"]:focus, textarea:focus { border-color: var(--blue); background: #fff; }
textarea { resize: vertical; min-height: 80px; line-height: 1.5; }

.form-spacer { flex: 1; } /* 撑开底部 */
.btn-submit {
  width: 100%; padding: 13px;
  background: var(--blue); color: #fff; border: none;
  border-radius: 8px; font-size: 15px; font-weight: 600;
  cursor: pointer; transition: background .15s, transform .1s; letter-spacing: .5px;
  margin-top: 4px;
}
.btn-submit:hover { background: #1251a3; }
.btn-submit:active { transform: scale(.98); }

/* ── RIGHT PANEL ── */
.right-panel { display: flex; flex-direction: column; height: 100%; overflow: hidden; min-width: 0; }
.right-card { flex: 1; min-height: 0; display: flex; flex-direction: column; overflow: hidden; }

/* ── WEEK NAV ── */
.week-nav {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 16px 20px;
  flex-shrink: 0;
  border-bottom: 1px solid var(--border);
}
.week-center { display: flex; align-items: center; gap: 10px; }
.week-range {
  font-size: 18px; font-weight: 800;
  color: var(--text); letter-spacing: -.3px;
  white-space: nowrap;
}
.week-count {
  font-size: 12px; font-weight: 600;
  color: var(--blue); background: var(--blue-bg);
  padding: 2px 10px; border-radius: 20px;
}

/* Circle navigation */
.week-pill { display: flex; align-items: center; gap: 8px; }
.pill-btn {
  width: 32px; height: 32px; border-radius: 50%;
  background: #F3F4F6; border: 1.5px solid #E4E8EF;
  color: #6B7280; font-size: 16px; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: background .15s, border-color .15s, color .15s; line-height: 1;
  flex-shrink: 0;
}
.pill-btn:hover { background: var(--blue-bg); border-color: var(--blue); color: var(--blue); }
.pill-btn.disabled { opacity: .35; cursor: not-allowed; pointer-events: none; }
.pill-sep { display: none; }

/* ── RECORD LIST ── */
.record-list { flex: 1; min-height: 0; padding: 8px 12px 12px; overflow-y: auto; }
.record-empty {
  text-align: center; color: var(--text-light);
  padding: 48px 0; font-size: 14px;
}
.record-item {
  display: flex; align-items: flex-start; gap: 10px;
  padding: 11px 8px; border-radius: 8px;
  transition: background .1s;
  border-bottom: 1px solid #F3F4F6;
}
.record-item:last-child { border-bottom: none; }
.record-item:hover { background: #F9FAFB; }
.record-num {
  flex: 0 0 22px; width: 22px; height: 22px; border-radius: 50%;
  background: var(--blue); color: #fff;
  font-size: 11px; font-weight: 700; margin-top: 3px;
  display: flex; align-items: center; justify-content: center; flex-shrink: 0;
}
.record-fields {
  flex: 1; display: flex; flex-direction: column;
  gap: 4px; min-width: 0;
}
.record-bubbles {
  display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
}
.bubble {
  padding: 3px 10px; border-radius: 20px;
  font-size: 12px; font-weight: 600;
  white-space: nowrap; flex-shrink: 0;
}
.bubble-type    { background: var(--orange-bg); color: var(--orange); }
.bubble-project { background: var(--green-bg);  color: #05974A; }
.record-divider { color: var(--border); font-size: 16px; flex-shrink: 0; line-height: 1.8; }
.record-content {
  color: var(--text); font-size: 13px;
  word-break: break-word; white-space: normal; line-height: 1.5;
  width: 100%;
}
.record-right {
  flex-shrink: 0; display: flex; align-items: center;
  gap: 8px; padding-left: 16px;
}
.record-issue { font-size: 12px; color: var(--text-light); white-space: nowrap; }
.record-issue.has-issue { color: #D97706; }
.btn-del {
  width: 22px; height: 22px; flex-shrink: 0;
  border: 2px solid #EF4444; background: #fff;
  border-radius: 50%; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: all .15s; color: #EF4444; font-size: 12px; font-weight: 700; line-height: 1;
  padding: 0;
}
.btn-del:hover { background: #FEF2F2; }

/* ── ACTION BAR ── */
.action-bar {
  display: flex; gap: 10px; justify-content: flex-end;
  padding: 14px 20px; border-top: 1px solid var(--border); flex-shrink: 0;
}
.btn-preview {
  padding: 9px 20px; border: 1.5px solid var(--blue);
  background: #fff; color: var(--blue); border-radius: 8px;
  font-size: 14px; font-weight: 600; cursor: pointer; transition: all .15s;
}
.btn-preview:hover { background: var(--blue-bg); }
.btn-send {
  padding: 9px 20px; border: none; background: var(--green);
  color: #fff; border-radius: 8px; font-size: 14px;
  font-weight: 600; cursor: pointer; transition: background .15s;
}
.btn-send:hover { background: #05974A; }
.btn-send:disabled, .btn-preview:disabled { opacity: .5; cursor: not-allowed; }

/* ── MODAL ── */
.modal-mask {
  position: fixed; inset: 0;
  background: rgba(0,0,0,.45);
  display: flex; align-items: center; justify-content: center;
  z-index: 100; opacity: 0; pointer-events: none;
  transition: opacity .2s;
}
.modal-mask.open { opacity: 1; pointer-events: auto; }
.modal {
  background: #fff; border-radius: 16px;
  width: 520px; max-width: calc(100vw - 32px);
  box-shadow: 0 20px 60px rgba(0,0,0,.2);
  transform: translateY(16px); transition: transform .2s;
  overflow: hidden;
}
.modal-mask.open .modal { transform: translateY(0); }
.modal-head {
  display: flex; align-items: center; justify-content: space-between;
  padding: 16px 20px; border-bottom: 1px solid var(--border);
}
.modal-title { font-size: 15px; font-weight: 700; }
.modal-close {
  width: 28px; height: 28px; border-radius: 6px;
  border: none; background: #F3F4F6;
  cursor: pointer; font-size: 16px; color: var(--text-sub);
  display: flex; align-items: center; justify-content: center;
  transition: background .15s;
}
.modal-close:hover { background: #E5E7EB; }
.modal-body {
  padding: 16px 20px 20px;
}
.modal-copy-btn {
  display: inline-flex; align-items: center; gap: 6px;
  margin-bottom: 12px; padding: 6px 14px;
  border: 1.5px solid var(--border); border-radius: 6px;
  background: #fff; color: var(--text-sub);
  font-size: 12px; font-weight: 600; cursor: pointer; transition: all .15s;
}
.modal-copy-btn:hover { border-color: var(--blue); color: var(--blue); }
.modal-pre {
  background: #F8FAFF; border: 1.5px solid var(--border);
  border-radius: 8px; padding: 14px 16px;
  font-family: 'Menlo', 'Consolas', monospace;
  font-size: 12.5px; line-height: 1.9;
  white-space: pre-wrap; word-break: break-all; color: #2d2d2d;
  max-height: 360px; overflow-y: auto;
}

/* ── TOAST ── */
.toast {
  position: fixed; bottom: 24px; left: 50%;
  transform: translateX(-50%) translateY(8px);
  background: #323232; color: #fff;
  padding: 10px 20px; border-radius: 8px; font-size: 13px;
  z-index: 200; opacity: 0; transition: all .25s; pointer-events: none;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
.toast.success { background: var(--green); }
.toast.error   { background: #EF4444; }

/* ── TEXTAREA HEIGHTS ── */
#inputContent { min-height: 133px; }
#inputIssue   { min-height: 80px; }

/* ── DEADLINE NOTICE ── */
.deadline-notice {
  display: flex; align-items: flex-start; gap: 8px;
  background: #FFF8E6; color: #D97706;
  border: 1.5px solid #FDE68A; border-radius: 8px;
  padding: 9px 13px; font-size: 12.5px; font-weight: 600;
  margin-bottom: 16px; line-height: 1.5;
}
.deadline-notice-icon { flex-shrink: 0; font-size: 13px; }

/* ── PUSH NOTICE ── */
.push-notice {
  background: #F0F9FF; color: #0369A1;
  border: 1.5px solid #BAE6FD; border-radius: 8px;
  padding: 9px 13px; font-size: 12.5px; font-weight: 600;
  margin-bottom: 12px; text-align: center; line-height: 1.5;
}

/* ── MODAL LOADING ── */
.modal-loading {
  display: flex; align-items: center; justify-content: center;
  gap: 10px; padding: 48px 20px; color: var(--text-sub); font-size: 14px;
}
.modal-spinner {
  width: 22px; height: 22px; border-radius: 50%;
  border: 2.5px solid var(--border);
  border-top-color: var(--blue);
  animation: spin .7s linear infinite; flex-shrink: 0;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* ── MOBILE ── */
@media (max-width: 767px) {
  .layout { grid-template-columns: 1fr; padding: 12px 12px 80px; gap: 14px; align-items: start; min-height: unset; }
  .week-range { font-size: 15px; }
}
</style>
</head>
<body>

<div class="topbar">
  <span class="topbar-title">升级运维 · 工作记录</span>
  <span class="topbar-week" id="topbarWeek">本周</span>
</div>

<div class="layout">

  <!-- ── 左：录入表单 ── -->
  <div class="card">
    <div class="card-head">添加工作记录</div>
    <div class="form-body">
      <div class="deadline-notice">
        <span class="deadline-notice-icon">⏰</span>
        <span>周期内录入工作记录截止到每周五 17:00</span>
      </div>
      <div class="form-group">
        <label class="form-label">项目类型</label>
        <div class="type-tabs" id="typeTabs">
          <div class="type-tab active" data-val="公交地铁">公交地铁</div>
          <div class="type-tab" data-val="企业班车">企业班车</div>
          <div class="type-tab" data-val="交通护驾">交通护驾</div>
          <div class="type-tab" data-val="大问号">大问号</div>
          <div class="type-tab" data-val="其他">其他</div>
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">所属项目</label>
        <input type="text" id="inputProject" placeholder="请输入所属项目名称">
      </div>
      <div class="form-group">
        <label class="form-label">工作内容</label>
        <textarea id="inputContent" placeholder="请描述本次工作内容"></textarea>
      </div>
      <div class="form-group">
        <label class="form-label">遇到的问题</label>
        <textarea id="inputIssue" placeholder="描述遇到的问题，无则留空"></textarea>
      </div>

      <div class="form-spacer"></div>
      <div class="push-notice">📅 每周五 18:00 自动推送至企微群</div>
      <button class="btn-submit" onclick="handleAdd()">提交记录</button>
    </div>
  </div>

  <!-- ── 右：记录列表 ── -->
  <div class="right-panel">
    <div class="card right-card">

      <!-- 周切换 -->
      <div class="week-nav">
        <div class="week-center">
          <span class="week-range" id="weekRangeDisplay"></span>
          <span class="week-count" id="recordCount">0 条</span>
        </div>
        <div class="week-pill">
          <button class="pill-btn" id="btnPrevWeek" onclick="changeWeek(-1)" title="上一周">‹</button>
          <span class="pill-sep">|</span>
          <button class="pill-btn" id="btnNextWeek" onclick="changeWeek(1)" title="下一周">›</button>
        </div>
      </div>

      <!-- 列表 -->
      <div class="record-list" id="recordList">
        <div class="record-empty">暂无记录，快来添加今天的工作吧</div>
      </div>

      <!-- 操作栏 -->
      <div class="action-bar">
        <button class="btn-preview" id="btnPreview" onclick="handlePreview()" disabled>预览周报</button>
        <button class="btn-send" id="btnSend" onclick="handleSend()" disabled>手动发送到企业微信</button>
      </div>

    </div>
  </div>

</div>

<!-- ── 预览弹窗 ── -->
<div class="modal-mask" id="modalMask" onclick="closeModal(event)">
  <div class="modal">
    <div class="modal-head">
      <span class="modal-title">周报预览</span>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-body">
      <button class="modal-copy-btn" onclick="copyReport()">
        <span>📋</span> 复制全文
      </button>
      <div class="modal-pre" id="modalPre"></div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const MAX_WEEKS = 52;
let selectedType = '公交地铁';
let currentWeekOffset = 0;

// ── 周工具函数 ──
function getWeekKey(offset = 0) {
  const d = new Date();
  d.setDate(d.getDate() + offset * 7);
  const day = d.getDay();
  d.setDate(d.getDate() - day + (day === 0 ? -6 : 1));
  // 用本地时间格式化，避免 toISOString() 因 UTC 偏差导致日期偏移
  const y  = d.getFullYear();
  const m  = String(d.getMonth() + 1).padStart(2, '0');
  const dd = String(d.getDate()).padStart(2, '0');
  return `${y}-${m}-${dd}`;
}

function getWeekDisplay(weekKey) {
  const mon = new Date(weekKey);
  const fri = new Date(weekKey);
  fri.setDate(mon.getDate() + 4);
  const dot = d => `${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getDate()).padStart(2,'0')}`;
  return `${dot(mon)} - ${dot(fri)}`;
}

function getCurrentWeekKey() { return getWeekKey(currentWeekOffset); }
function isCurrentWeek()     { return currentWeekOffset === 0; }

// ── 存储 ──
function loadRecords(weekKey) {
  try { return JSON.parse(localStorage.getItem(`wr_${weekKey}`) || '[]'); }
  catch { return []; }
}
function saveRecords(weekKey, records) {
  const keys = getAllWeekKeys();
  if (!keys.includes(weekKey) && keys.length >= MAX_WEEKS) {
    keys.sort();
    localStorage.removeItem(`wr_${keys[0]}`);
  }
  localStorage.setItem(`wr_${weekKey}`, JSON.stringify(records));
}
function getAllWeekKeys() {
  const keys = [];
  for (let i = 0; i < localStorage.length; i++) {
    const k = localStorage.key(i);
    if (k && k.startsWith('wr_')) keys.push(k.replace('wr_', ''));
  }
  return keys;
}

// ── 格式化周报 ──
function formatReport(records, reportDate) {
  if (!records.length) return '';
  const VALID = ['公交地铁','企业班车','交通护驾','大问号','其他'];
  return [
    `负责人：张达奇｜升级运维项目｜本周工作进展（${reportDate}）`,
    ...records.map((r,i) =>
      `${i+1}. ${VALID.includes(r.projectType)?r.projectType:'其他'}｜${r.project}｜${r.content}｜${r.issue||'无'}`
    ),
    '@软件团队小助手'
  ].join('\n');
}

// ── UI 更新 ──
function updateHeader() {
  const wk = getCurrentWeekKey();
  document.getElementById('weekRangeDisplay').textContent = getWeekDisplay(wk);
  document.getElementById('btnPrevWeek').classList.remove('disabled');
  document.getElementById('btnNextWeek').classList.toggle('disabled', currentWeekOffset >= 0);
}

function renderRecords() {
  const wk = getCurrentWeekKey();
  const records = loadRecords(wk);
  const list = document.getElementById('recordList');

  document.getElementById('recordCount').textContent = `${records.length} 条`;
  document.getElementById('btnPreview').disabled = records.length === 0;
  document.getElementById('btnSend').disabled    = records.length === 0;

  if (!records.length) {
    list.innerHTML = '<div class="record-empty">暂无记录</div>';
    return;
  }
  list.innerHTML = records.map((r,i) => `
    <div class="record-item">
      <span class="record-num">${i+1}</span>
      <div class="record-fields">
        <div class="record-bubbles">
          <span class="bubble bubble-type">${r.projectType}</span>
          <span class="bubble bubble-project">${r.project}</span>
          <span class="record-divider">|</span>
        </div>
        <span class="record-content">${r.content}</span>
      </div>
      <div class="record-right">
        <span class="record-issue ${r.issue&&r.issue!=='无'?'has-issue':''}">${r.issue&&r.issue!=='无'?'⚠ '+r.issue:'无问题'}</span>
        <button class="btn-del" onclick="handleDelete('${r.id}')" title="删除"><span>✕</span></button>
      </div>
    </div>
  `).join('');
}

// ── 操作 ──
function handleAdd() {
  const project = document.getElementById('inputProject').value.trim();
  const content = document.getElementById('inputContent').value.trim();
  const issue   = document.getElementById('inputIssue').value.trim() || '无';
  if (!project) { showToast('所属项目不能为空', 'error'); return; }
  if (!content) { showToast('工作内容不能为空', 'error'); return; }
  if (!isCurrentWeek()) {
    showToast('只能在当前周添加记录', 'error');
    currentWeekOffset = 0; updateHeader(); renderRecords(); return;
  }
  const wk = getCurrentWeekKey();
  const records = loadRecords(wk);
  records.push({
    id: Date.now().toString(36)+Math.random().toString(36).slice(2),
    date: new Date().toISOString().split('T')[0],
    projectType: selectedType, project, content, issue,
    createdAt: new Date().toISOString()
  });
  saveRecords(wk, records);
  document.getElementById('inputProject').value = '';
  document.getElementById('inputContent').value = '';
  document.getElementById('inputIssue').value   = '';
  renderRecords();
  showToast('记录已添加', 'success');
}

function handleDelete(id) {
  const wk = getCurrentWeekKey();
  saveRecords(wk, loadRecords(wk).filter(r => r.id !== id));
  renderRecords();
  showToast('已删除');
}

function handlePreview() {
  const pre = document.getElementById('modalPre');
  pre.innerHTML = '<div class="modal-loading"><div class="modal-spinner"></div><span>生成中…</span></div>';
  document.getElementById('modalMask').classList.add('open');
  setTimeout(() => {
    const wk = getCurrentWeekKey();
    const records = loadRecords(wk);
    const today = new Date().toISOString().split('T')[0];
    const report = formatReport(records, today) || '本周暂无记录';
    pre.textContent = report;
  }, 300);
}

function closeModal(e) {
  if (e && e.target !== document.getElementById('modalMask')) return;
  document.getElementById('modalMask').classList.remove('open');
}

function copyReport() {
  const text = document.getElementById('modalPre').textContent;
  navigator.clipboard.writeText(text).then(() => showToast('已复制到剪贴板', 'success'));
}

function handleSend() {
  showToast('（原型演示）实际发送需输入 CRON_SECRET', 'error');
}

function changeWeek(dir) {
  const next = currentWeekOffset + dir;
  if (next > 0) return;
  currentWeekOffset = next;
  updateHeader(); renderRecords();
}

// ── Tab 切换 ──
document.getElementById('typeTabs').addEventListener('click', e => {
  const tab = e.target.closest('.type-tab');
  if (!tab) return;
  document.querySelectorAll('.type-tab').forEach(t => t.classList.remove('active'));
  tab.classList.add('active');
  selectedType = tab.dataset.val;
});


// ── Toast ──
let toastTimer;
function showToast(msg, type='info') {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = `toast ${type} show`;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2800);
}
